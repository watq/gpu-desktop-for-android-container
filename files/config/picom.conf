# ════════════════════════════════════════════════════════════════
# picom.conf —— Termux:X11(:2) 独立合成器 (CFG4)
# 生成 2026-09-22
#
# 背景: xfwm4 自带合成器在 :2 下用不了 → 关掉后无 GPU 合成, 鼠标拖动掉帧
#       (VNC:1 不受影响, 那边 xfwm4 合成正常)。用 picom v10 独立合成替代。
#
# ★ backend = glx: 实测吃到 GPU (zink→Turnip→Adreno 830v1 / Accelerated yes)。
#   之前日志里 "X error 8 MATCH / Failed to bind root back pixmap" 的崩溃,
#   根因是【两个 picom 同时抢 :2】(合成器打架), 不是 glx 本身 —— 单实例 glx 稳定。
# ★ use-damage = false: Termux:X11 下开 damage 追踪偶发 bind root pixmap 报错,
#   关掉最稳 (整屏重绘, GPU 合成下开销可接受)。
# ★ 只做合成消除撕裂/补帧, 不加阴影/圆角/模糊 —— 移动端 GPU 省着用, 先要流畅。
# ════════════════════════════════════════════════════════════════

# ★★ 2026-09-23 改 backend = xrender (原 glx)。这是 ":2 桌面全黑" 的真凶, 三组对照实测:
#      A: 硬件GPU + picom(glx)    → 抓根窗口 8.5KB  = 纯黑, 面板/壁纸全看不见
#      B: 硬件GPU + 不起 picom    → 974KB = 桌面正常
#      C: 硬件GPU + picom(xrender)→ 975KB = 桌面正常【且合成器在】  ← 采用
#   GPU 环境三组完全相同(MESA_LOADER_DRIVER_OVERRIDE=kgsl / Adreno 830v1 / Accelerated:yes),
#   黑屏只跟 picom 后端走, 不跟 GPU 走。
#   机理: 应用(xfdesktop/panel)自己的 GPU 渲染一直是好的; 问题出在 picom 用 GLX 把【合成结果】
#      present 到屏幕这一步 —— Termux:X11 缺 DRI3 present 路径, 合成完的画面推不出去 → 全黑。
#      xrender 后端走 X11 原生 XRender 扩展合成, 不碰 GLX present → 正常上屏。
#   ⚠ 所以【不要】为了这个黑屏去关 GPU/退软件渲染(那是误修: GPU 白丢了, 面板照样不显示)。
#   ※ 想恢复 glx 只在 DRI3-over-mmap 那条路打通后再试(见账本 E-K补3/铁律29)。
backend = "xrender";
vsync = true;
use-damage = false;

# GLX 微调: 仅在 backend=glx 时生效; 当前走 xrender, 保留不影响(切回 glx 时还用得上)
glx-no-stencil = true;
glx-no-rebind-pixmap = true;

# 不做特效 (先保帧率; 想要阴影/圆角以后再开)
shadow = false;
fading = false;
corner-radius = 0;
blur-background = false;

# 全屏窗口取消重定向, 直通 GPU (视频/全屏应用更流畅、更省)
unredir-if-possible = true;

# 让 xfce 自己的窗口不被额外处理
detect-client-opacity = true;
detect-transient = true;
detect-rounded-corners = true;
