# ~/.config/mpv/mpv.conf —— 2026-09-24 重建 (账本 ⑬节 V4 / 原 N8)
# 环境: proot Ubuntu 24.04 + mpv 0.37.0 (libplacebo v6.338) + Mesa 26.3 (Turnip / kgsl), Adreno 830
# 实测素材: 1080p H.264 yuv420p 23.976fps; 在 Termux:X11(:2) 上每组跑 ~13 秒, 重复 3 轮取平均。
# 旧机 zink 时期的配方(vo=gpu + x11egl + gpu-api=opengl)只作参考, 下面每项都按新机重测过。

# ── 输出: gpu-next + Vulkan(Turnip 直出) ──
# 为什么是 gpu-next+vulkan (CPU 为 mpv 进程 占单核%, 3 轮均值):
#   gpu-next + vulkan(x11vk)          ~42%   0 丢帧, 抓帧 13/13 有画面
#   gpu-next + x11egl + kgsl GL       ~43%   0 丢帧, 但要 MESA_LOADER_DRIVER_OVERRIDE=kgsl 环境变量
#   gpu-next + x11egl + zink GL       ~48%   (:2 会话默认 GL 就是 zink)
#   gpu      + x11egl + zink (旧配方)  ~47%
#   gpu      + x11egl + kgsl GL       ~49%   且 xwd 抓帧 12 帧里 4 帧整窗全黑(交换时闪黑) → 不用
# Vulkan 路径不吃 MESA_LOADER_DRIVER_OVERRIDE / VK_ICD_FILENAMES: 清空这些变量实测仍选中
#   "Adreno (TM) 830v1 (integrated)", 所以菜单启动(不带 use2 环境)也一样走硬件, 不需要改 desktop。
# gpu-context 钉死 x11vk: 不写的话先白试 waylandvk; 另外 0.37 的 gpu-next 在 gpu-api=auto 时
#   会先选 OpenGL(→ :2 上落到 zink), 所以 gpu-api 也要显式写 vulkan。
vo=gpu-next
gpu-api=vulkan
gpu-context=x11vk

# ── 画质档 ──
# 本机 0.37 日志显示 gpu-hq 只是 high-quality 的别名, 直接写正式名(旧名以后可能被删)。
# 实测开 high-quality 窗口/全屏都 0 丢帧, CPU 不增加(~37-40%), 缩放开销全在 GPU 上。
profile=high-quality

# ── 硬解: 关 ──
# 实测本机没有可用硬解, 全部回落软解:
#   auto-safe     → 0.37 只试 nvdec / vaapi, 都失败(libcuda 缺、vaGetDriverNames failed), 回落软解
#   v4l2m2m-copy  → "h264_v4l2m2m: can't configure decoder"(proot 里没有 /dev/video*)
#   vulkan        → "Device does not support the VK_KHR_video_decode_queue extension"(Turnip 无 Vulkan Video)
# 软解 1080p H.264 约占单核 40%, 8 核机器完全够用。直接写 no 省掉每次开文件的探测报错。
# 注意: 系统 /etc/mpv/mpv.conf(dpkg 原装, md5 与包内 conffile 一致)写着 hwdec=vaapi, 本文件后读, 会覆盖它。
# 以后 Turnip 支持 Vulkan Video 了, 可改成 hwdec=vulkan 再测。
hwdec=no

# ── 丢帧策略: 只在解码跟不上时丢 ──
# 实测走 pulse(PULSE_SERVER=127.0.0.1 → Termux 侧)出声时, 默认 framedrop=vo 每秒会丢约 1 帧
#   (13 秒 12~14 帧, vo=gpu / gpu-next / zink 全都一样, ao=null 时为 0 → 是 pulse 音频时钟抖动所致)。
#   改 framedrop=decoder 后 0 丢帧, avsync 仍在 ±0.0001s 内。
#   (试过 pulse-latency-hacks=yes → 丢 97 帧, 更差; video-sync=display-resample → delayed 392/mistimed 299,
#    因为 Termux:X11 报的刷新率 29.9Hz 不可信; pulse-buffer / audio-buffer / 48k 采样率 都无改善)
framedrop=decoder

# ── 窗口 ──
# :2 屏幕 1280x1024, 1080p 片子默认窗口会比屏幕大; 限制初始窗口不超过屏幕 90%。
autofit-larger=90%x90%

# ── 备用档: 万一 Vulkan 出问题, 手动 mpv --profile=gl-compat 文件 ──
# 即 E-BE 实测可用的老组合(GL 走会话默认驱动, :2 上是 zink)。
[gl-compat]
profile-desc=回落: vo=gpu + x11egl (OpenGL)
vo=gpu
gpu-api=opengl
gpu-context=x11egl
